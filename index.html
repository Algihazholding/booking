<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to right, #00416A, #E4E5E6);
            color: #fff;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .button {
            text-decoration: none;
            font-size: 1.2rem;
            padding: 15px 30px;
            color: #fff;
            border-radius: 10px;
            background: #0066CC;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: background 0.3s ease, transform 0.2s;
        }
        .button:hover {
            background: #004B99;
            transform: translateY(-3px);
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .button {
                font-size: 1rem;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Algihaz Booking System</h1>
        <p>Please select your category to proceed:</p>
        <div class="buttons">
            <a class="button" href="https://koalendar.com/e/meeting-room-reservation-form-koayPmHQ" target="_blank">Algihaz Member</a>
            <a class="button" href="https://docs.google.com/forms/d/e/1FAIpQLScKaBMUvTNy7IrlbJ4i95uabJQq-bRK2SQ_044zKK7XwBVzog/viewform" target="_blank">Guest</a>
        </div>
    </div>
</body>
</html>
